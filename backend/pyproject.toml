[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal backend: FastAPI API, temporary SQLite database, and static frontend hosting."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "litellm>=1.102.0",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]
